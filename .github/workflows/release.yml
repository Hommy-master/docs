name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送v开头的tag时触发

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 安装pnpm
      uses: pnpm/action-setup@v4.1.0
      with:
        version: 10   # 明确指定 pnpm 大版本 (推荐)

    - name: 设置Node.js环境
      uses: actions/setup-node@v3
      with:
        node-version: 22
        cache: 'pnpm'  # 自动缓存 pnpm 依赖

    - name: 安装依赖
      run: pnpm install

    - name: 编译
      run: pnpm run build

    - name: 检查编译结果
      run: ls -lhR ./docs/.vitepress/dist

    # 压缩代码
    - name: 压缩代码
      run: |
        # 写入commit hash到文件中
        echo "${{ github.sha }}" > ./docs/.vitepress/dist/commit_hash.txt
        # 压缩代码
        cd ./docs/.vitepress/dist
        tar -czvf ../../../dist.tar.gz ./*
        cd -

    # 上传为 workflow artifact，保留 30 天；不写入 GitHub Releases 页面
    - name: 上传压缩包
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ github.ref_name }}
        path: dist.tar.gz
        retention-days: 30
        if-no-files-found: error
